[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "previsao-carga-energia"
version = "0.1.0"
description = "Previsão de Carga de Energia Diária do Subsistema Sudeste/Centro-Oeste (ONS) com dbt, DuckDB, LightGBM e MLflow"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Endrew Gomes" }
]
dependencies = [
    "duckdb>=1.0.0",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "lightgbm>=4.0.0",
    "mlflow>=2.10.0",
    "scikit-learn>=1.3.0",
    "holidays>=0.40",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "streamlit>=1.30.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

